course:
  id: highlevel-marketplace-app-development
  title: "HighLevel - Marketplace App Development"
  level: "Beginner to Advanced"
  format: "Continuous learning path"
  audience:
    description: >
      Slightly technical HighLevel and automation users who want to progress from
      non-coder concepts into building and publishing real Marketplace apps.
    prerequisites:
      - "Basic familiarity with HighLevel"
      - "Comfort using automation tools"
      - "No prior coding experience required"
  outcome: >
    Students progress from understanding APIs and HighLevel integrations to
    designing, building, deploying, securing, monetizing, and publishing
    production-ready HighLevel Marketplace apps.

  modules:
    - number: 1
      title: "What Is a HighLevel Marketplace App?"
      lessons:
        - "Marketplace ecosystem"
        - "Agency vs location apps"
        - "Public vs private integrations"
        - "Common app categories"
        - "API vs webhook vs embedded UI"
        - "Anatomy of a Marketplace app"
      build: "Draw the architecture of your first app."

    - number: 2
      title: "APIs for Non-Coders"
      lessons:
        - "What an API is"
        - "Requests and responses"
        - "GET, POST, PUT, and DELETE"
        - "JSON"
        - "Headers"
        - "Authentication"
        - "Status codes"
        - "Reading API documentation"
        - "Using Postman, Bruno, or Insomnia"
      build: "Make your first HighLevel API request."

    - number: 3
      title: "HighLevel API Fundamentals"
      lessons:
        - "API documentation"
        - "Location IDs"
        - "Contacts"
        - "Opportunities"
        - "Conversations"
        - "Calendars"
        - "Users"
        - "Custom fields"
        - "Tags"
        - "Workflows"
      build: "Retrieve contacts from a HighLevel account."

    - number: 4
      title: "Private Integrations"
      lessons:
        - "Private Integration Tokens"
        - "Permissions and scopes"
        - "Creating tokens"
        - "Protecting credentials"
        - "Testing authenticated API calls"
      build: "Create a small internal HighLevel integration."

    - number: 5
      title: "Webhooks"
      lessons:
        - "What webhooks solve"
        - "Events vs polling"
        - "Receiving webhooks"
        - "Contact events"
        - "Opportunity events"
        - "Appointment events"
        - "Payment events"
        - "Webhook security"
      build: "Receive a HighLevel webhook and display its data."

    - number: 6
      title: "Your First Backend"
      lessons:
        - "What a backend does"
        - "Python basics needed for integrations"
        - "Variables"
        - "Functions"
        - "Dictionaries"
        - "HTTP requests"
        - "Environment variables"
        - "Introduction to Django"
      build: "Create a simple Django integration server."

    - number: 7
      title: "Databases for Marketplace Apps"
      lessons:
        - "Why apps need a database"
        - "PostgreSQL"
        - "Tables"
        - "IDs"
        - "Relationships"
        - "Users"
        - "Organizations"
        - "HighLevel locations"
        - "Credentials"
        - "Logs"
      build: "Store connected HighLevel locations."

    - number: 8
      title: "OAuth 2.0"
      lessons:
        - "OAuth explained simply"
        - "Authorization URL"
        - "Redirect URI"
        - "Authorization code"
        - "Access token"
        - "Refresh token"
        - "Scopes"
        - "Token expiration"
      build: "Connect a HighLevel account using OAuth."

    - number: 9
      title: "Building the Installation Flow"
      lessons:
        - "Install button"
        - "HighLevel authorization"
        - "Callback URL"
        - "Creating the organization"
        - "Saving tokens"
        - "Detecting the installed location"
        - "Installation success screen"
      build: "Complete an end-to-end app installation."

    - number: 10
      title: "Working With HighLevel Contacts"
      lessons:
        - "Read contacts"
        - "Create contacts"
        - "Update contacts"
        - "Search contacts"
        - "Custom fields"
        - "Tags"
        - "Avoiding duplicates"
      build: "Create a contact sync tool."

    - number: 11
      title: "Conversations and Messaging"
      lessons:
        - "HighLevel Conversations API"
        - "SMS"
        - "Email"
        - "Conversation threads"
        - "Message direction"
        - "Message providers"
        - "External messaging services"
      build: "Create an external messaging integration."

    - number: 12
      title: "Opportunities and Pipelines"
      lessons:
        - "Pipelines"
        - "Stages"
        - "Opportunities"
        - "Assignment"
        - "Opportunity status"
        - "Automating stage movement"
      build: "Automatically create and update opportunities."

    - number: 13
      title: "Calendars and Appointments"
      lessons:
        - "Calendars"
        - "Availability"
        - "Appointment creation"
        - "Rescheduling"
        - "Cancellation"
        - "Appointment webhooks"
      build: "Create an external booking integration."

    - number: 14
      title: "Building a HighLevel Embedded App"
      lessons:
        - "Custom menu links"
        - "Embedded apps"
        - "Location context"
        - "Passing location information"
        - "App navigation"
        - "Building a SaaS-style dashboard"
        - "Responsive layouts"
      build: "Add your own application interface inside HighLevel."

    - number: 15
      title: "Deploying Your Marketplace App"
      lessons:
        - "Development vs production"
        - "GitHub"
        - "Environment variables"
        - "Docker basics"
        - "Railway"
        - "PostgreSQL"
        - "Domains"
        - "HTTPS"
        - "Logs"
        - "Migrations"
        - "Backups"
      build: "Deploy the app publicly."

  advanced_module_roadmap:
    - number: 16
      title: "Multi-Tenant SaaS Architecture"
    - number: 17
      title: "SaaS V2 and Rebilling"
    - number: 18
      title: "Marketplace App Billing"
    - number: 19
      title: "Advanced OAuth and Token Management"
    - number: 20
      title: "API Rate Limits and Queues"
    - number: 21
      title: "Advanced Webhooks"
    - number: 22
      title: "Building Payment Provider Apps"
    - number: 23
      title: "Building SMS Provider Apps"
    - number: 24
      title: "Building AI Apps for HighLevel"
    - number: 25
      title: "MCP Servers for HighLevel"
    - number: 26
      title: "CLI Tools for HighLevel"
    - number: 27
      title: "White-Label Marketplace Apps"
    - number: 28
      title: "Security and Credential Encryption"
    - number: 29
      title: "Testing and CI/CD"
    - number: 30
      title: "Publishing to the HighLevel Marketplace"
    - number: 31
      title: "Real Marketplace App Builds"
      continuous: true
      examples:
        - "Local payment provider integration"
        - "Android SMS gateway"
        - "Lead enrichment app"
        - "Booking integration"
        - "AI agent integration"
        - "Reporting dashboard"
